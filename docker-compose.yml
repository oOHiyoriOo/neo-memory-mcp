services:
  neo-memory-db:
    image: neo4j:latest
    container_name: neo-memory-db
    restart: unless-stopped
    ports:
      - "7474:7474" # Nur Web-UI nach außen offen
    # 7687 (Bolt) ist standardmäßig intern im Docker-Netzwerk erreichbar
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - ./neo4j-data:/data
      - ./neo4j-logs:/logs
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1" ]
      start_period: 2m
      interval: 30s
      timeout: 10s
      retries: 5

  neo-memory-mcp:
    image: node:lts
    container_name: neo-memory-mcp
    restart: on-failure:3
    depends_on:
      neo-memory-db:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3742:3742"
    environment:
      HTTP_PORT: 3742
      NEO4J_URI: bolt://neo-memory-db:7687 # Direkter interner Zugriff via Servicename
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    command: node dist/index.js
